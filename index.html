<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mason Homme TikTok Creator Brief">
  <title>Mason Homme Creator Brief</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f5;
      --ink: #111;
      --canvas: #e9e9e7;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--canvas);
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .toolbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 10px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid rgba(17, 17, 17, 0.12);
      background: rgba(247, 247, 245, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .toolbar strong {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .toolbar span {
      color: #666;
      font-size: 12px;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 28px;
      padding: 28px 16px 48px;
    }

    .brief-page {
      position: relative;
      width: min(100%, 794px);
      aspect-ratio: 595 / 842;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.12);
    }

    .brief-page > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .video-slot {
      position: absolute;
      width: 28.39%;
      height: 26.13%;
      overflow: hidden;
      background: #111;
    }

    .video-slot.one { left: 7.06%; top: 13.77%; }
    .video-slot.two { left: 37.48%; top: 13.77%; }
    .video-slot.three { left: 7.06%; top: 48.93%; }
    .video-slot.four { left: 37.48%; top: 48.93%; }

    .video-slot video {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
      object-fit: cover;
    }

    .video-slot video:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -4px;
    }

    .video-status {
      position: fixed;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      max-width: min(320px, calc(100vw - 28px));
      padding: 10px 13px;
      border-radius: 3px;
      background: rgba(17, 17, 17, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .video-status.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .toolbar { min-height: 44px; }
      .toolbar strong { font-size: 11px; }
      .toolbar span { font-size: 11px; }
      main { gap: 16px; padding: 16px 8px 32px; }
      .brief-page { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); }
    }

    @media print {
      .toolbar, .video-status { display: none; }
      body, html { background: #fff; }
      main { display: block; padding: 0; }
      .brief-page {
        width: 210mm;
        height: 297mm;
        page-break-after: always;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <strong>MASON HOMME</strong>
    <span>Creator Brief · 10 pages</span>
  </header>

  <main aria-label="Mason Homme Creator Brief">
    <section class="brief-page" aria-label="Page 1">
      <img src="assets/page-1.jpg" alt="Mason Homme creator brief cover">
    </section>
    <section class="brief-page" aria-label="Page 2">
      <img src="assets/page-2.jpg" alt="About Mason Homme" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 3">
      <img src="assets/page-3.jpg" alt="JF148 pleated shorts" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 4">
      <img src="assets/page-4.jpg" alt="JF150 pleated straight-leg trousers" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 5">
      <img src="assets/page-5.jpg" alt="JM030 pleated short-sleeve polo" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 6">
      <img src="assets/page-6.jpg" alt="Content direction" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 7">
      <img src="assets/page-7.jpg" alt="Content direction details" loading="lazy">
    </section>
    <section class="brief-page" id="video-references" aria-label="Page 8 with playable video references">
      <img src="assets/page-8.jpg" alt="Visual and video references" loading="lazy">
      <div class="video-slot one">
        <video controls playsinline preload="none" poster="assets/video-01-poster.jpg" aria-label="Pleated shorts try-on video reference">
          <source src="assets/video-01-fast.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="video-slot two">
        <video controls playsinline preload="none" poster="assets/video-02-poster.jpg" aria-label="Trousers styling video reference">
          <source src="assets/video-02-fast.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="video-slot three">
        <video controls playsinline preload="none" poster="assets/video-03-poster.jpg" aria-label="City walk movement video reference">
          <source src="assets/video-03-fast.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="video-slot four">
        <video controls playsinline preload="none" poster="assets/video-04-poster.jpg" aria-label="Basic look details video reference">
          <source src="assets/video-04-fast.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
    </section>
    <section class="brief-page" aria-label="Page 9">
      <img src="assets/page-9.jpg" alt="Collaboration benefits and deliverables" loading="lazy">
    </section>
    <section class="brief-page" aria-label="Page 10">
      <img src="assets/page-10.jpg" alt="Frequently asked questions and important notes" loading="lazy">
    </section>
  </main>

  <div class="video-status" role="status" aria-live="polite"></div>

  <script>
    const videos = [...document.querySelectorAll('video')];
    const status = document.querySelector('.video-status');
    let statusTimer;

    function showStatus(message) {
      status.textContent = message;
      status.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('show'), 1800);
    }

    videos.forEach((video, index) => {
      video.addEventListener('play', () => {
        videos.forEach(other => {
          if (other !== video) other.pause();
        });
        showStatus(`Video reference ${index + 1} is playing`);
      });
      video.addEventListener('pause', () => {
        if (!video.ended) showStatus(`Video reference ${index + 1} paused`);
      });
      video.addEventListener('error', () => {
        showStatus(`Video reference ${index + 1} could not be loaded`);
      });
    });
  </script>
</body>
</html>
